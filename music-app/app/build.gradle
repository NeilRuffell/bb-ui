plugins { id 'com.android.application' }

android {
    namespace 'dev.q25.bbmusic'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.q25.bbmusic'
        minSdk 33
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// An ordinary Android application: no BB UI module dependency, no
// Xposed/Vector, SystemUI APIs, root, privileged permissions, or audio engine.
