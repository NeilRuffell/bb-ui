plugins { id 'com.android.application' }

android {
    namespace 'dev.q25.bbmusic'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.q25.bbmusic'
        minSdk 33
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// An ordinary Android application: no BB UI module dependency, no
// Xposed/Vector, SystemUI APIs, root, privileged permissions, or audio engine.

dependencies {
    // Standalone first-party player, independent of Symfonium and BB UI.
    // Same stable Media3 version for player, session, and MediaController.
    def media3Version = '1.11.1'
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"
}
