name: Verify BB7 Root UI

on:
  push:
    branches:
      - feat/bb7-root-ui-presentation
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.11.1 (AGP 8.9 compatible)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 35
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --fail --location --retry 3 \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            --output /tmp/android-cmdline-tools.zip
          unzip -q /tmp/android-cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile and run tests
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify Vector legacy entrypoint is packaged in APK
        run: |
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/xposed_init \
            | grep -Fx 'dev.q25.trackpad.theme.SystemBb7VisualHook'
          unzip -l app/build/outputs/apk/debug/app-debug.apk \
            | grep -E 'classes[0-9]*[.]dex'
      - name: Save debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bb7-root-ui-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
