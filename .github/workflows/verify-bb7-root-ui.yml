name: Verify BB7 Root UI

on:
  push:
    branches:
      - feat/bb7-root-ui-presentation
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.11.1 (AGP 8.9 compatible)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK API 35
        uses: android-actions/setup-android@v3
      - name: Install required platform/build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile and run tests
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Save debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bb7-root-ui-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
